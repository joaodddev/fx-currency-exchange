spring:
  application:
    name: fx-currency-exchange

  datasource:
    url: jdbc:postgresql://localhost:5432/fxdb
    username: fxuser
    password: fxpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  jwt:
    secret: 4fK9mZ2pL7qR1sT6wY3xB8nC0dE5hG
    expiration-ms: 86400000
  exchange:
    api-url: https://openexchangerates.org/api
    app-id: 63a8065d6e5341498657feb5424aceb8
    cache-ttl-minutes: 30