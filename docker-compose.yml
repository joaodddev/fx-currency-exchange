version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: fx_postgres
    environment:
      POSTGRES_DB: fxdb
      POSTGRES_USER: fxuser
      POSTGRES_PASSWORD: fxpass
    ports:
      - "5432:5432"
    volumes:
      - fx_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fx_redis
    ports:
      - "6379:6379"
    volumes:
      - fx_redis_data:/data

volumes:
  fx_postgres_data:
  fx_redis_data: